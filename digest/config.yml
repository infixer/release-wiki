# Release Wiki で追跡するリポジトリとブログ。
# 追加・削除はこのファイルを編集して push するだけ。追加した回は直近 7 日分を取り込む。

repos:
  # branch を省略すると、そのリポジトリの既定ブランチ（main / master など）を追跡する
  - repo: react/react # facebook/react は転送されるだけなので正式名を書く（転送元でも collect が取り直す）
    branch: main
  - repo: vercel/next.js
    branch: canary # next.js には main が無い
    # 任意の設定:
    # excludeLabels: [dependencies]  # このラベルが付いた PR は集めない
    # maxPrs: 60                     # 1 回で詳しく扱う PR の上限（超えた分は 1 行扱い。既定 60）
  - repo: vuejs/core
  - repo: nuxt/nuxt
  - repo: adobe/react-spectrum
  - repo: microsoft/TypeScript
  - repo: oxc-project/oxc
    maxPrs: 30 # PR がとても多い（週 150 件前後）ので、詳しく書くのは 30 件まで
  - repo: pnpm/pnpm
    maxPrs: 30 # PR がとても多い（週 300 件前後。Rust 版 pacquet の開発を含む）ので、詳しく書くのは 30 件まで
  - repo: vitest-dev/vitest
  - repo: anthropics/claude-code
  - repo: openai/codex
    includeCommits: true # PR を通さずコミットで入る運用なので、直接のコミットを集める

  # 標準仕様
  - repo: whatwg/html
  - repo: w3c/csswg-drafts
    includeCommits: true # エディタが PR を通さずに直接コミットすることが多いので、直接のコミットも集める
  - repo: w3c/aria
  - repo: w3c/wcag
  - repo: openui/open-ui
  - repo: tc39/ecma262
  - repo: tc39/proposals
    # README の表が本体（どの提案がどの Stage に進んだか）なので、差分を持たせて「その他」扱いにしない
    includeCommits: true
    classifyByFiles: false
    patch: 3000

blogs:
  # RSS/Atom があるブログは feed、無いサイトは一覧ページを page に書く
  - id: chrome
    title: Chrome の新機能
    page: https://developer.chrome.com/new?hl=ja
    # 一覧ページの中で記事として拾うリンク。URL が変わらない新着一覧ページ（…/news、…/whats-new、…/release-notes）は除く。
    # カテゴリのトップ（/docs/ai など、他のリンクの親にあたるパス）は collect が自動で除く
    linkPattern: "^https://developer\\.chrome\\.com/(blog|release-notes|docs)/(?!(.*/)?(news|whats-new|release-notes)(\\?|$)).+"
    # 記事も日本語版（翻訳が無ければ英語）で取る
    articleParams:
      hl: ja
  - id: firefox
    title: Firefox リリースノート
    page: https://www.firefox.com/en-US/releases/
    # デスクトップ版のリリースノートだけ（ESR・Beta・Android・iOS は除く）
    linkPattern: "/firefox/\\d+(\\.\\d+)+/releasenotes/?$"
    sortBy: version # 一覧の並び順に頼らず、バージョン番号の大きい順に扱う
    titleTemplate: "Firefox {version}" # 記事のタイトルがどれも同じなので、URL のバージョン番号から作る
  - id: safari
    title: Safari リリースノート
    docc: https://developer.apple.com/documentation/safari-release-notes # Apple のドキュメント（JSON で取得）
    maxText: 30000
    # 本文が maxText を超えるときは、修正された不具合の一覧を省く（件数だけ残す）
    dropSectionsWhenLong: "^(Resolved Issues|Known Issues)$"
  - id: anthropic
    title: Anthropic News
    page: https://www.anthropic.com/news
    linkPattern: "^https://www\\.anthropic\\.com/news/[^/?#]+$"
  # RSS の例:
  # - id: nextjs
  #   title: Next.js Blog
  #   feed: https://nextjs.org/feed.xml
  #   relatedRepo: vercel/next.js      # 任意: 関連リポジトリ
  #   titleFilter: "^Next\\.js \\d"   # 任意: タイトルで絞る正規表現
