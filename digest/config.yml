# Release Wiki で追跡するリポジトリとブログ。
# 追加・削除はこのファイルを編集して push するだけ。追加した回は直近 7 日分を取り込む。

repos:
  - repo: react/react # facebook/react は転送されるだけなので正式名を書く（転送元でも collect が取り直す）
    branch: main
  - repo: vercel/next.js
    branch: canary # next.js には main が無い
    # 任意の設定:
    # excludeLabels: [dependencies]  # このラベルが付いた PR は集めない
    # maxPrs: 60                     # 1 回で詳しく扱う PR の上限（超えた分は 1 行扱い。既定 60）

blogs:
  - id: react
    title: React Blog
    feed: https://react.dev/rss.xml
    relatedRepo: react/react
  - id: nextjs
    title: Next.js Blog
    feed: https://nextjs.org/feed.xml
    relatedRepo: vercel/next.js
    # titleFilter: "^Next\\.js \\d"  # リリース記事だけに絞る場合の正規表現
