# Release Wiki で追跡するリポジトリとブログ。
# 追加・削除はこのファイルを編集して push するだけ。追加した回は直近 7 日分を取り込む。

repos:
  - repo: react/react # facebook/react は転送されるだけなので正式名を書く（転送元でも collect が取り直す）
    branch: main
  - repo: vercel/next.js
    branch: canary # next.js には main が無い
    # 任意の設定:
    # excludeLabels: [dependencies]  # このラベルが付いた PR は集めない
    # maxPrs: 60                     # 1 回で詳しく扱う PR の上限（超えた分は 1 行扱い。既定 60）

blogs:
  # RSS/Atom があるブログは feed、無いサイトは一覧ページを page に書く
  - id: chrome
    title: Chrome の新機能
    page: https://developer.chrome.com/new?hl=ja
    # 一覧ページの中で記事として拾うリンク。URL が変わらない新着一覧ページ（…/news、…/whats-new、…/release-notes）は除く。
    # カテゴリのトップ（/docs/ai など、他のリンクの親にあたるパス）は collect が自動で除く
    linkPattern: "^https://developer\\.chrome\\.com/(blog|release-notes|docs)/(?!(.*/)?(news|whats-new|release-notes)(\\?|$)).+"
    # 記事も日本語版（翻訳が無ければ英語）で取る
    articleParams:
      hl: ja
  # RSS の例:
  # - id: nextjs
  #   title: Next.js Blog
  #   feed: https://nextjs.org/feed.xml
  #   relatedRepo: vercel/next.js      # 任意: 関連リポジトリ
  #   titleFilter: "^Next\\.js \\d"   # 任意: タイトルで絞る正規表現
